# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support (required by the new DSL). KSP 2.3.x is compatible with it.
android.builtInKotlin=true

# Enables the `screenshotTest` source set for the Compose Preview Screenshot Testing plugin.
android.experimental.enableScreenshotTest=true
